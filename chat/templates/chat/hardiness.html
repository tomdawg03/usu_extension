<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find hardiness Zone</title>
    {% load static %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf0 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 22px; color: #0F2439; margin-bottom: 8px; }
        .header p { font-size: 14px; color: #6b7280; }
        .optional { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
        .lookup-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .lookup-row input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }
        .lookup-row button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #0F2439 0%, #1a3d5a 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
        }
        .lookup-row button:hover { opacity: 0.9; }
        .result-box {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(15,36,57,0.08);
            padding: 20px;
            display: none;
        }
        .result-box.visible { display: block; }
        .result-box .zone { font-size: 18px; font-weight: 600; color: #0F2439; }
        .result-box .error { color: #b91c1c; }
        .back { margin-bottom: 16px; }
        .back a { color: #0F2439; text-decoration: none; font-size: 14px; }
        .back a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back"><a href="{% url 'hub' %}?county={{ county|urlencode }}">← Back</a></div>
        <div class="header">
            <h1>Find hardiness Zone</h1>
            <p>Look up the plant hardiness zone for your area by ZIP code.</p>
        </div>
        
        <div class="lookup-row">
            <input type="text" id="zipInput" placeholder="Enter zip code" maxlength="10" autocomplete="postal-code">
            <button type="button" id="lookupBtn">Look up</button>
        </div>
        <div class="result-box" id="resultBox">
            <div id="resultContent"></div>
        </div>
    </div>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var county = params.get('county');
            if (county) localStorage.setItem('selected_county', county);
        })();
        (function() {
            var zipInput = document.getElementById('zipInput');
            var lookupBtn = document.getElementById('lookupBtn');
            var resultBox = document.getElementById('resultBox');
            var resultContent = document.getElementById('resultContent');
            function doLookup() {
                var zip = (zipInput.value || '').trim();
                resultBox.classList.remove('visible');
                resultContent.innerHTML = '';
                if (!zip) {
                    resultContent.className = 'error';
                    resultContent.textContent = 'Please enter a ZIP code.';
                    resultBox.classList.add('visible');
                    return;
                }
                lookupBtn.disabled = true;
                fetch('/api/hardiness?zip=' + encodeURIComponent(zip))
                    .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
                    .then(function(obj) {
                        resultBox.classList.add('visible');
                        if (obj.ok) {
                            resultContent.className = 'zone';
                            resultContent.textContent = 'Hardiness zone: ' + (obj.data.zone || '');
                        } else {
                            resultContent.className = 'error';
                            resultContent.textContent = obj.data.error || 'No hardiness zone found for that ZIP code.';
                        }
                    })
                    .catch(function() {
                        resultBox.classList.add('visible');
                        resultContent.className = 'error';
                        resultContent.textContent = 'Something went wrong. Please try again.';
                    })
                    .finally(function() { lookupBtn.disabled = false; });
            }
            lookupBtn.addEventListener('click', doLookup);
            zipInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLookup(); });
        })();
    </script>
</body>
</html>
