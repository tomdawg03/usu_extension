<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnes – USU Extension Assistant</title>
    {% load static %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 20px auto;
            width: 100%;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(15, 36, 57, 0.15);
            overflow: hidden;
            border: 1px solid rgba(15, 36, 57, 0.1);
        }

        .chat-header {
            background: linear-gradient(135deg, #0F2439 0%, #1a3d5a 100%);
            color: white;
            padding: 24px 28px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(15, 36, 57, 0.2);
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: linear-gradient(to bottom, #fafbfc 0%, #ffffff 100%);
        }

        .chat-messages::-webkit-scrollbar { width: 8px; }
        .chat-messages::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #0F2439; border-radius: 4px; }
        .chat-messages::-webkit-scrollbar-thumb:hover { background: #1a3d5a; }

        .message {
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            animation: messageSlideIn 0.3s ease-out;
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0F2439 0%, #1a3d5a 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: #ffffff;
            color: #2c3e50;
            border: 1px solid #e8ecef;
            border-bottom-left-radius: 4px;
        }

        .message.bot a { color: #0F2439; text-decoration: underline; font-weight: 500; }
        .message.bot a:hover { color: #1a3d5a; }
        .chat-message p { margin-bottom: 12px; line-height: 1.6; }
        .chat-message ul { margin-left: 20px; margin-bottom: 12px; }
        .chat-message a { color: #0F2439; font-weight: 500; text-decoration: underline; }

        .chat-input-container {
            display: flex;
            padding: 20px;
            border-top: 1px solid #e8ecef;
            gap: 12px;
            background-color: #ffffff;
            flex-wrap: wrap;
        }

        .chat-input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            flex-wrap: wrap;
        }

        .chat-category-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .chat-category-row label { font-size: 13px; color: #6b7280; }
        .chat-category-row select {
            padding: 8px 12px;
            border: 1px solid #e8ecef;
            border-radius: 8px;
            font-size: 14px;
            background: #fafbfc;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e8ecef;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #fafbfc;
        }

        .chat-input:focus {
            outline: none;
            border-color: #0F2439;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(15, 36, 57, 0.1);
        }

        .send-button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #0F2439 0%, #1a3d5a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(15, 36, 57, 0.2);
            letter-spacing: 0.3px;
        }

        .send-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 36, 57, 0.3);
            background: linear-gradient(135deg, #1a3d5a 0%, #0F2439 100%);
        }

        .send-button:active { transform: translateY(0); box-shadow: 0 2px 6px rgba(15, 36, 57, 0.2); }
        .send-button:disabled { background: #cbd5e0; cursor: not-allowed; transform: none; box-shadow: none; }

        .county-badge { display: inline-block; margin-top: 8px; }
        .county-badge a {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-decoration: none;
            cursor: pointer;
        }
        .county-badge a:hover { background: rgba(255, 255, 255, 0.3); }

        .chat-suggestions {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            min-height: 200px;
        }

        .chat-suggestions h2 { font-size: 15px; font-weight: 600; color: #6b7280; margin: 0; }

        .suggestion-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

        .suggestion-pill {
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid #e8ecef;
            background: #ffffff;
            color: #0F2439;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            box-shadow: 0 1px 3px rgba(15, 36, 57, 0.06);
        }

        .suggestion-pill:hover {
            background: rgba(15, 36, 57, 0.06);
            border-color: rgba(15, 36, 57, 0.2);
            color: #0F2439;
        }

        .message.loading {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            min-height: 52px;
        }

        .message.loading .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #e8ecef;
            border-top-color: #0F2439;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .message.loading .loading-text { color: #6b7280; font-size: 14px; font-weight: 500; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .feedback-controls {
            margin-top: 10px;
            font-size: 12px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .feedback-label { font-weight: 500; }

        .feedback-button {
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid #e5e7eb;
            background-color: #f9fafb;
            color: #374151;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .feedback-button:hover { background-color: #edf2f7; border-color: #cbd5e0; }
        .feedback-button:disabled { cursor: default; opacity: 0.6; }

        .escalation-form {
            margin-top: 12px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e8ecef;
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .escalation-form.visible { display: flex; }

        .escalation-form input {
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .escalation-form textarea {
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }

        .escalation-form .submit-btn {
            padding: 10px 20px;
            background: #0F2439;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            align-self: flex-start;
        }

        .escalation-form .submit-btn:hover { opacity: 0.9; }

        .escalation-sent {
            margin-top: 4px;
            font-size: 13px;
            color: #16a34a;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Agnes – USU Extension Assistant</h1>
            <div class="county-badge" id="countyBadge" style="display: none;">
                <a href="{% url 'county_select' %}">County: <span id="countyName"></span></a>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-suggestions" id="suggestionsSection">
                <h2>Try asking something like:</h2>
                <div class="suggestion-pills">
                    <button type="button" class="suggestion-pill" data-question="When should I plant tomatoes in this county?">When should I plant tomatoes in this county?</button>
                    <button type="button" class="suggestion-pill" data-question="What vegetables grow best here?">What vegetables grow best here?</button>
                    <button type="button" class="suggestion-pill" data-question="How often should I water my lawn locally?">How often should I water my lawn locally?</button>
                    <button type="button" class="suggestion-pill" data-question="What fruit trees perform well in this area?">What fruit trees perform well in this area?</button>
                </div>
            </div>
        </div>
        <div class="chat-input-container">
            <div class="chat-category-row">
                <label for="mainCategory">Category:</label>
                <select id="mainCategory">
                    {% for cat in main_categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
                <label for="subcategory">Subcategory:</label>
                <select id="subcategory">
                    {% for sub in subcategory_map.Other %}
                    <option value="{{ sub }}">{{ sub }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="chat-input-row">
                <input
                    type="text"
                    class="chat-input"
                    id="messageInput"
                    placeholder="Ask Agnes a question about your farm, garden, or local Extension resources..."
                    autocomplete="off"
                >
                <button class="send-button" id="sendButton">Send</button>
            </div>
        </div>
    </div>

    {{ subcategory_map|json_script:"subcategory-map-json" }}
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{% static 'chat/chat.js' %}?v=6"></script>
</body>
</html>
