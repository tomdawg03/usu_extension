<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your County - USU Extension</title>
    {% load static %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(15, 36, 57, 0.15);
            padding: 48px;
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(15, 36, 57, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #0F2439;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 16px;
            color: #6b7280;
            font-weight: 400;
        }

        #map {
            height: 750px;
            max-height: 80vh;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(15, 36, 57, 0.1);
            background: #ffffff;
        }

        @media (max-width: 640px) {
            #map { height: 400px; }
        }

        .county-label {
            font-size: 12px;
            font-weight: 500;
            color: #111827;
            pointer-events: none;
            background: none !important;
            border: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Select Your County</h1>
            <p>Click a county on the map to get personalized assistance</p>
        </div>
        <div id="map"></div>
    </div>
    <script>window.GEOJSON_URL = "{% static 'chat/utah_counties.geojson' %}";</script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="{% static 'chat/county_select.js' %}?v=4"></script>
</body>
</html>
