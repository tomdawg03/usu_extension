<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your County - USU Extension</title>
    {% load static %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f0f5;
            color: #1f2937;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Full-width column, aligned with chat page */
        .county-page {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 28px;
        }

        .map-page-header {
            width: 100%;
            max-width: 680px;
            text-align: center;
            padding: 8px 12px 20px;
        }

        .map-page-header h1 {
            font-size: clamp(17px, 2.5vw, 20px);
            font-weight: 600;
            letter-spacing: 0.01em;
            color: #374151;
            margin-bottom: 8px;
        }

        .map-page-sub {
            font-size: 14px;
            line-height: 1.45;
            color: #6b7280;
            font-weight: 400;
        }

        .map-wrap {
            width: 100%;
            max-width: min(920px, 100%);
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 0 4px;
        }

        #map {
            width: 100%;
            height: min(72vh, 780px);
            min-height: 420px;
            border-radius: 12px;
            border: 1px solid #e4e4ea;
            background: #fafafa;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        }

        @media (max-width: 640px) {
            .county-page {
                padding: 16px 12px 24px;
            }

            .map-page-header {
                padding-bottom: 16px;
            }

            #map {
                height: min(58vh, 520px);
                min-height: 320px;
                border-radius: 10px;
            }
        }

        .county-label {
            font-size: 11px;
            font-weight: 500;
            color: #374151;
            pointer-events: none;
            background: none !important;
            border: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
    <div class="county-page">
        <header class="map-page-header">
            <h1>Select Your County</h1>
            <p class="map-page-sub">Click a county on the map to get personalized assistance</p>
        </header>
        <div class="map-wrap">
            <div id="map"></div>
        </div>
    </div>
    <script>window.GEOJSON_URL = "{% static 'chat/utah_counties.geojson' %}";</script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="{% static 'chat/county_select.js' %}?v=6"></script>
</body>
</html>
